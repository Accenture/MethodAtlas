# Runs OWASP Dependency-Check and SpotBugs SARIF upload every Monday at
# 03:00 UTC and on manual dispatch.
#
# SpotBugs results are uploaded to GitHub Code Scanning so findings appear
# in the Security tab and as PR diff annotations.
#
# MethodAtlas AI self-analysis runs separately on every push to main via
# pages.yml → methodatlas-analysis.yml using GitHub Models (no secrets needed).
name: Security scan

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 03:00 UTC
  workflow_dispatch:

# Least privilege: read-only token at the top level; write scopes are
# granted only on the job that needs them.
permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-db-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        if: ${{ env.NVD_API_KEY != '' }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.NVD_API_KEY != '' }}
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          retention-days: 30

  code-scanning:
    name: Code scanning (SpotBugs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to Code Scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # SpotBugs is configured to emit SARIF alongside HTML (build.gradle).
      - name: Run SpotBugs (produces SARIF)
        run: ./gradlew spotbugsMain

      - name: Upload SpotBugs SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs
