# Submits the resolved Gradle dependency graph to GitHub on every push to
# main, so Dependabot alerts cover transitive and build-tool dependencies.
#
# Replaces GitHub's "Automatic Dependency Submission (Gradle)", which runs a
# GitHub-managed workflow pinned to JDK 21 and fails at configuration time
# because the build requires Java 25 (ZeroEcho-lib 1.2.x is compiled for
# Java 25). Automatic dependency submission must be disabled in
# Settings → Code security → Dependency graph, otherwise both submit.
name: Dependency submission

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: read-only token at the top level; write scopes are
# granted only on the job that needs them.
permissions:
  contents: read

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the dependency submission API

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
