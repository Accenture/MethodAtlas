# OpenSSF Scorecard supply-chain posture analysis (roadmap RM-F, SABSA EX-010).
# Results are published to the OpenSSF API (badge + scorecard.dev) because the
# repository is public, and uploaded to GitHub code scanning as SARIF.
# Note: the 'Signed-Releases' check is expected to stay unmet — managed-key
# release signing is deliberately not used (owner decision D-1); keyless build
# provenance (D-4) is produced by release.yml instead.
name: Scorecard supply-chain security

on:
  schedule:
    - cron: '23 4 * * 1'   # weekly, Monday 04:23 UTC
  push:
    branches: [ main ]
  workflow_dispatch:

# Deny everything at workflow level; the job grants only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results to the OpenSSF API (OIDC)
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
